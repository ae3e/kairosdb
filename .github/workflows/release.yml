name: Release to GHCR

on:
  workflow_dispatch:
    branches: [ "release" ]
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # adapte si tu utilises une autre version

      - name: Build package (creates build/*.tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          export CLASSPATH="tools/tablesaw-1.3.0.jar"
          java make package
          ls -lah build

      - name: Find tar artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          TAR_PATH="$(ls -1 build/*.tar.gz | head -n 1)"
          echo "tar_path=$TAR_PATH" >> "$GITHUB_OUTPUT"
          echo "tar_name=$(basename "$TAR_PATH")" >> "$GITHUB_OUTPUT"

      #- name: Create GitHub Release
      #  id: create_release
      #  uses: softprops/action-gh-release@v2
      #  with:
      #    name: ${{ github.ref_name }}
      #    tag_name: ${{ github.ref_name }}
      #    generate_release_notes: true
      #    files: |
      #      ${{ steps.artifact.outputs.tar_path }}
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max